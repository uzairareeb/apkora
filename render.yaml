services:
  - type: web
    name: apkora
    runtime: docker
    plan: free
    repo: https://github.com/uzairareeb/apkora
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "1"
      - key: INSTALLED
        value: "0"
